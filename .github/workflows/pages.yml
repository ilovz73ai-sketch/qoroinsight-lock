# 시험 → 잠금 페이지 빌드 → GitHub Pages. 배포본 푸터의 커밋 해시가 이 저장소의 커밋과 같다.
name: Lock page on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 환경 변수 없이 빌드한다 — 그래야 누구나 같은 커밋을 다시 빌드해 배포본과 바이트까지 같은지 확인할 수 있다(npm run check-lock).
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lock/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
